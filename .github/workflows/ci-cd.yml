name: CI/CD - ticket-service

# Se ejecuta en cada push a la rama principal (y manualmente desde la pestana Actions)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Valores NO sensibles (se pueden ver en el repo). Los unicos secrets necesarios son
# DOCKERHUB_TOKEN y EC2_SSH_KEY. Cualquiera de estos valores puede sobrescribirse con un secret del mismo nombre.
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'noch1' }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'noch1' }}/ticket-service
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
  # En AWS Academy la IP publica cambia al reiniciar el laboratorio: actualizar aqui (o con el secret EC2_HOST)
  EC2_HOST: ${{ secrets.EC2_HOST || 'PENDIENTE' }}
  S3_BUCKET: ${{ secrets.S3_BUCKET || 'PENDIENTE' }}

jobs:
  # 1) Compilar y ejecutar las pruebas automatizadas
  build-test:
    name: Build y pruebas (Maven)
    runs-on: ubuntu-latest
    outputs:
      docker_ok: ${{ steps.secrets.outputs.docker_ok }}
      deploy_ok: ${{ steps.secrets.outputs.deploy_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Si aun no se configuran los secrets, los jobs de Docker/deploy se omiten en vez de fallar
      - name: Verificar secrets configurados
        id: secrets
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          [ -n "$DH_TOKEN" ] && echo "docker_ok=true" >> "$GITHUB_OUTPUT" || echo "::warning::Faltan secrets de Docker Hub: se omite la publicacion de la imagen"
          [ "$EC2_HOST" != "PENDIENTE" ] && [ -n "$EC2_KEY" ] && echo "deploy_ok=true" >> "$GITHUB_OUTPUT" || echo "::warning::Faltan secrets de EC2: se omite el despliegue"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y probar
        run: mvn -B clean verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # 2) Construir la imagen Docker y publicarla en Docker Hub
  docker:
    name: Imagen Docker -> Docker Hub
    needs: build-test
    if: needs.build-test.outputs.docker_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Desplegar en la instancia EC2 por SSH
  deploy:
    name: Despliegue en EC2
    needs: [build-test, docker]
    if: needs.build-test.outputs.deploy_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar contenedor en EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,S3_BUCKET,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e
            echo ">> Verificando que el EFS este montado en /mnt/efs"
            mountpoint -q /mnt/efs || { echo "ERROR: EFS no montado en /mnt/efs"; exit 1; }
            sudo mkdir -p /mnt/efs/ticket-service
            sudo chown 1000:1000 /mnt/efs/ticket-service

            echo ">> Descargando imagen $IMAGE"
            docker pull "$IMAGE"

            echo ">> Reemplazando contenedor"
            docker rm -f ticket-service 2>/dev/null || true

            # Credenciales: si no se definen los secrets AWS_*, el SDK usa el rol IAM de la instancia (recomendado)
            CRED_ARGS=""
            if [ -n "$AWS_ACCESS_KEY_ID" ]; then
              CRED_ARGS="-e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
              [ -n "$AWS_SESSION_TOKEN" ] && CRED_ARGS="$CRED_ARGS -e AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
            fi

            docker run -d --name ticket-service --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs/ticket-service:/data/efs \
              -e EFS_BASE_PATH=/data/efs \
              -e S3_BUCKET="$S3_BUCKET" \
              -e AWS_REGION="${AWS_REGION:-us-east-1}" \
              $CRED_ARGS \
              "$IMAGE"

            echo ">> Esperando health check"
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then
                echo ">> Despliegue OK"; docker image prune -f; exit 0
              fi
              sleep 4
            done
            echo "ERROR: la aplicacion no respondio"; docker logs --tail 100 ticket-service; exit 1
