server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticket-service
  datasource:
    # La BD H2 se guarda en el EFS (EFS_BASE_PATH) para que los datos sobrevivan
    # a cada redeploy del contenedor. En local cae en ./efs-local/db
    url: ${DB_URL:jdbc:h2:file:${app.efs.base-path}/db/ticketsdb;AUTO_SERVER=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
  servlet:
    multipart:
      max-file-size: 10MB

app:
  efs:
    # Punto de montaje del EFS dentro del contenedor (docker run -v /mnt/efs:/mnt/efs)
    base-path: ${EFS_BASE_PATH:./efs-local}
    tickets-dir: tickets
    # Si es true, el PDF se borra del EFS luego de subirlo correctamente a S3
    # (EFS como almacenamiento "temporal"). Por defecto se conserva como cache.
    delete-after-upload: ${EFS_DELETE_AFTER_UPLOAD:false}
  s3:
    bucket: ${S3_BUCKET:tickets-eventos-bucket}
    region: ${AWS_REGION:us-east-1}
    # Solo para pruebas locales con LocalStack (ej: http://localhost:4566). Vacio en AWS.
    endpoint: ${S3_ENDPOINT:}
    # Subida automatica a S3 al generar el ticket
    auto-upload: ${S3_AUTO_UPLOAD:true}
  seed:
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.duoc.tickets: INFO
